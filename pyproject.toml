[tool.poetry]
name = "EnglishCoach"
version = "0.1.0"
description = "Vocal Coach in english"
authors = ["thimotte <thimottenicolas@gmail.com>"]
readme = "README.md"


[tool.poetry.dependencies]
python = "^3.14"
requests = "^2.31"
pandas = "^2.2.2"
sounddevice = "^0.5.6"
faster-whisper = "^1.2.1"
django = "^6.1.1"
django-environ = "^0.14.0"
scipy = "^1.18.1"
gunicorn = "^26.2.0"
dj-database-url = "^3.1.2"
whitenoise = "^6.12.0"



[tool.poetry.group.dev.dependencies]
ruff = "^0.4.4"
pytest = "^7.0"
psycopg2-binary = "^2.9"



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "B", "I", "UP"]
fixable = ["ALL"]
exclude = ["venv", ".venv", "tests/fixtures"]